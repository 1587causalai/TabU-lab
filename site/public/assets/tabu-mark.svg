<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">TabU-lab mark</title>
  <desc id="desc">A typed table becoming a connected field of tokens.</desc>
