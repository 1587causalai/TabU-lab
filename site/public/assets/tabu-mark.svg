  <rect x="5" y="5" width="86" height="86" rx="25" fill="#07111f" stroke="#26364d" stroke-width="2"/>
  <path d="M26 24h44M26 48h44M26 72h44M26 24v48M48 24v48M70 24v48" stroke="#334155" stroke-width="2"/>
