name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: contract / python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.10.0
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: ModelSpec schema is current
        run: uv run python scripts/build_model_spec_schema.py --check
      - name: TabUBase source closure is current when owner source is available
        run: uv run python scripts/build_model_source_manifest.py --check --if-available
      - name: TabUBase contract tests
        run: uv run pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install uv==0.10.0
          uv build
      - name: Smoke installed wheel outside the checkout
        run: |
          uv venv /tmp/tabubase-wheel-smoke
          uv pip install --python /tmp/tabubase-wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/tabubase-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"
