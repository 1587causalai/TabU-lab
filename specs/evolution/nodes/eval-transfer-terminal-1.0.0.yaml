schema_version: tabu.evolution-node.v1
kind: evaluation_protocol
node_id: tabu.eval.transfer-lanes-terminal
version: 1.0.0
maturity: experimental
description: Independent transfer receipts with the preregistered terminal checkpoint as sole primary checkpoint; intermediate checkpoints are diagnostic learning-curve points only.
prediction_interface: tabu.prediction-bundle@1
prediction_compatibility_key: tabu.eval.predictions.openml8-split-v1
split_authority: terminal_checkpoint_only_no_metric_selection
modes: [synthetic_fit, real_scratch, frozen_icl, fine_tune_transfer]
metrics: [loss, scratch_minus_pretrained_gain]
can_rescore_from_predictions: true
