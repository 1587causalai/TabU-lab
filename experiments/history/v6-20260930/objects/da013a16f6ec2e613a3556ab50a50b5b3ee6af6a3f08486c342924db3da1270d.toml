[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tfm-data"
version = "0.1.0"
description = "Independent synthetic table generators and reproducible corpus recipes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy==2.4.6", "scikit-learn==1.9.0"]

[project.scripts]
tfm-data = "tfm_data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tfm_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
