  "mathematics": {
    "schema_version": "1.0.0",
    "abstract": "TabU-v2 / TabUR is a five-step cell-as-query structural contract whose extended carrier, visible-only source lane, exact-zero dynamics, hierarchical response field, typed terminal, and loss-only truth boundary are explicit.",
    "unit_semantics": "The table row is the semantic Unit, the table column is a Feature, and a cell is a query address; Unit tokens, Feature tokens, and the shared W matrix are not semantic Units.",
    "notation": [
      {
        "id": "visible_evidence",
        "symbol": "\\mathcal E_{\\mathrm{in}}",
        "domain": "input-side episode",
        "meaning": "The typed visible evidence allowed to enter Steps 1--4."
      },
      {
        "id": "query_set",
        "symbol": "\\mathcal Q",
        "domain": "cell addresses",
        "meaning": "The query cells whose values are withheld from the forward path."
      },
      {
        "id": "initial_carrier",
        "symbol": "\\bm H^{(0)}",
        "domain": "(N+K) x (M+K) x d",
        "meaning": "The extended four-block carrier produced after typed preprocessing and encoding."
      },
      {
        "id": "final_carrier",
        "symbol": "\\bm H^{(L)}",
        "domain": "(N+K) x (M+K) x d",
        "meaning": "The single complete output of whole-table OTransformer dynamics."
      },
      {
        "id": "response_field",
        "symbol": "A_{ra}=W+\\lambda_{\\mathrm F}(F_a+\\lambda_{\\mathrm U}U_r)",
        "domain": "cell address (r,a)",
        "meaning": "The canonical hierarchical response field used by the TabUR readout."
      },
      {
        "id": "truth_sidecar",
        "symbol": "\\TruthSidecar",
        "domain": "Step 5 only",
        "meaning": "The loss-only store for query-cell truth."
      }
    ],
    "steps": [
      {
        "id": "typed_episode",
        "title": "Typed episode and truth isolation",
        "purpose": "Compile visible evidence, query addresses, support, and loss-only truth without allowing target truth into the forward path.",
        "equations": [
          {
            "id": "evidence_partition",
            "latex": "\\mathcal O=\\mathcal V\\mathbin{\\dot\\cup}\\mathcal Q,\\qquad \\mathcal E_{\\mathrm{in}}=\\mathcal V",
            "meaning": "Visible value cells and query cells are separate episode roles."
          }
        ],
        "invariants": [
          "Changing loss-side truth does not change input-side evidence."
        ]
      },
      {
        "id": "typed_carrier",
        "title": "Typed preprocessing and four-block carrier",
        "purpose": "Encode visible typed values and shared query seeds into one extended table.",
        "equations": [
          {
            "id": "carrier_shape",
            "latex": "\\bm H^{(0)}\\in\\mathbb R^{(N+K)\\times(M+K)\\times d}",
            "meaning": "The carrier contains the cell plane, Unit Query columns, Feature Query rows, and Null corner."
          }
        ],
        "invariants": [
          "Query and Null slots add receiver positions but do not add factual source values."
        ]
      },
      {
        "id": "whole_table_dynamics",
        "title": "Whole-table OTransformer dynamics",
        "purpose": "Propagate information through the declared column-then-row OMAB topology under one episode-compiled source mask.",
        "equations": [
          {
            "id": "transformer_output",
            "latex": "\\bm H^{(L)}=\\operatorname{OTransformer}_{\\theta}(\\bm H^{(0)};\\mathsf M^{\\mathrm{src}})",
            "meaning": "The dynamics expose one complete extended-table output."
          }
        ],
        "invariants": [
          "The source mask is visible-only and Query/Null source contribution is exactly zero."
        ]
      },
      {
        "id": "hierarchical_readout",
        "title": "Hierarchical response field and typed terminal",
        "purpose": "Read Unit, Feature, and Cell views from the same final carrier and form typed response states.",
        "equations": [
          {
            "id": "response_geometry",
            "latex": "A_{ra}=W+\\lambda_{\\mathrm F}(F_a+\\lambda_{\\mathrm U}U_r),\\qquad \\bm z_{ra}=A_{ra}\\bm c_{ra}",
            "meaning": "Address-broadcast response gates combine shared, Feature, and Unit structure."
          }
        ],
        "invariants": [
          "Changing response gates does not change Steps 1--3, source masks, or the target set."
        ]
      },
      {
        "id": "loss_sidecar",
        "title": "Cell-completion loss",
        "purpose": "Pair typed predictions with query-cell truth only after the forward prediction exists.",
        "equations": [
          {
            "id": "masked_objective",
            "latex": "\\mathcal L_{\\mathrm{mask}}=\\mathcal L_{\\mathrm{num}}+\\mathcal L_{\\mathrm{disc}}",
            "meaning": "Masked-cell restoration is the foundation objective; supervised loss is additive when explicitly enabled."
          }
        ],
        "invariants": [
          "Truth enters only at Step 5 through the TruthSidecar."
        ]
      }
    ],
    "invariants": [
      {
        "id": "single_final_carrier",
        "statement": "OTransformer returns one complete H^(L), and all Step 4 views are slices of that carrier.",
        "evidence": "forward output and shape trace"
      },
      {
        "id": "visible_only_source",
        "statement": "Only input-visible value cells can provide factual K/V source.",
        "evidence": "source-mask trace"
      },
      {
        "id": "exact_zero_closure",
        "statement": "Null and fully empty source domains remain exact zero through attention and writeback.",
        "evidence": "layerwise exact-zero test"
      },
      {
        "id": "truth_isolation",
        "statement": "Replacing query truth changes only the Step 5 loss.",
        "evidence": "TruthSidecar substitution test"
      },
      {
        "id": "address_equivariance",
        "statement": "Row and column permutations jointly permute states and predictions without address lookup parameters.",
        "evidence": "permutation equivariance test"
      },
      {
        "id": "axis_b_noninheritance",
        "statement": "Similarity to old axis-B or legacy TabUR formulas does not imply receipt or checkpoint inheritance.",
        "evidence": "identity and lineage audit"
      }
    ]
  }
