kill_conditions:
- nonfinite loss, gradients, model or optimizer state
- data, configuration or source identity mismatch
- cumulative wall budget exhausted; keep last validated boundary
evidence_plan:
- initial, each 32 rounds, and terminal fixed eight-mask evaluation on training rows
- Query and retained encoding MSE; numeric original-unit error; discrete accuracy;
  coverage
- per-table, type and source summaries; update durations and CUDA peak allocation
- local receipts and checkpoints are primary; W&B is a progress mirror
- reserved 52 rows remain unscored; no unseen-table claim or direct cross-model loss
  comparison
- 'each complete round: one pre-update loss per table, equal-table mean, median and
  linear-interpolation P95'
- 'fixed evaluation: aggregate all eight masks within each table, then report equal-table
  distributions separately for Query and retained, numeric and discrete'
- partial rounds are not complete-round points; partial evaluations have separate
  metric names and explicit table counts
- numeric tail protection computed from the 204 training rows before masking; protected
  counts reported per column and table, reserved rows excluded
- same tail eligibility policy for training and eight fixed evaluation masks; Query
  metrics describe the selected eligible domain
- pre-clip and post-clip gradient norms reported separately; no loss weighting or
  value clipping change
