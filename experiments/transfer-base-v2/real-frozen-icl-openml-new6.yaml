evaluation_design:
  checkpoint_seeds: [1729, 2718, 31415]
  split_seeds: [1729, 2718, 31415]
  context_sizes: [0, 1, 2, 4, 8, 16, 32]
  query_limit: 256
  query_chunk_rows: 64
  feature_rule: >-
    Split first; if required, select at most 63 predictors by train-only
    variance. All preregistered new6 datasets are already within the limit.
  classification_primary_curve: exclude K below the declared class count
  regression_primary_curve: K in [1, 2, 4, 8, 16, 32]
  comparison: >-
    Re-run the existing PT-S1 and expanded checkpoints on this same panel with
    identical splits, queries, and contexts; report old6 and new6 macros
    separately.

frozen_protocol:
  arms: [pretrained_frozen, random_init_frozen, pretrained_shuffled]
  one_independent_model_instance_per_arm: true
  requires_grad: false
  eval_mode: true
  inference_mode: true
  optimizer_created: false
  parameter_hash_gate:
    scope: every frozen arm for every checkpoint, dataset, and split
    timing: immediately adjacent before and after each arm evaluation
    algorithm: SHA-256 over model state
    acceptance: before and after hashes must be byte-identical
    aggregate_gate: all_frozen_arm_parameter_hashes_unchanged must be true

claim_boundary: >-
  Candidate preregistration only. No OpenML rows have been downloaded, no arm
  has been evaluated, and this file supports no empirical, foundation-model,
  causal, release, or benchmark claim.
