evaluation_design:
  checkpoint_seeds: [1729, 2718, 31415]
  split_seeds: [1729, 2718, 31415]
  context_policy: full_train
  train_fraction: 0.7
  context_rows: all_train_partition_rows
  context_label_visibility: every train-partition response is visible in one frozen invocation
  query_policy: all_heldout_rows
  query_limit: null
  query_predictor_visibility: every held-out predictor row is jointly visible in one episode
  query_response_visibility: held-out responses are scorer-only TruthSidecar values
  single_transductive_episode: true
  no_context_or_query_sampling_or_truncation: true
  query_readout_chunk_rows: 64
  query_chunk_rows: 64
  classification_primary_metrics: []
  regression_primary_metrics: [scaled_rmse, scaled_mae, r2]
  regression_reported_common_metrics: [rmse, mae, scaled_rmse, scaled_mae, r2]
  common_scorer_contract: identical held-out rows, target scale, and metric implementation

frozen_protocol:
  arms: [pretrained_frozen, random_init_frozen, pretrained_shuffled]
  one_independent_model_instance_per_arm: true
  requires_grad: false
  eval_mode: true
  inference_mode: true
  optimizer_created: false
  parameter_hash_gate:
    algorithm: SHA-256 over model state
    acceptance: before and after hashes are byte-identical for every checkpoint and arm

baseline_protocol:
  role: supervised_fitted_inductive_comparators_not_frozen_icl_arms
  estimators: [xgboost, mlp]
  fit_rows: all_train_partition_rows
  query_rows: all_heldout_rows
  tuning_or_validation_rows: none
  estimator_seed: split_seed
  checkpoint_seed_replication: none

claim_boundary: >-
  Exploratory local_unissued optimizer-free real-data full-context ICL
  diagnostic. The OpenML CTR23 cache and split/task records are provenance
  inputs, not independently reviewed formal data authority. Side-by-side MLP
  and XGBoost values are descriptive and do not support SOTA, benchmark,
  foundation-model, or causal claims.
