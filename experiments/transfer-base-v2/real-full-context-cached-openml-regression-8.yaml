panel_id: tabubase-real-full-context-cached-openml-regression-8-v1
experiment_id: tabubase-real-full-context-cached-openml-regression-8-3x3-v1
status:
  registration: candidate_preregistered
  execution: not_run
  data_materialization: pinned_cache_available_not_evaluated
  empirical_claim: none

purpose: >-
  Exploratory optimizer-free full-context TabUBase ICL on eight additional
  numeric-only OpenML CTR23 regression tables. Every train-partition row is
  exposed with its label and every held-out row is queried in one complete
  transductive episode. This panel is independent of the existing new6 panel.

model:
  contract_id: tabu.cell.base
  contract_version: 0.2.0
  profile_id: supervised.label_broadcast.v1
tokenizer:
  version: cell-tokenizer.v2
  nominal_plan: source_scoped_frozen_codebook.v2
  codebook_size: 100
  codebook_seed: 1729

source_contract:
  provider: OpenML cached ARFF
  api: scipy.io.arff.loadarff
  identity_key: data_id
  parser: liac-arff
  cache: true
  materialization_checks:
    - ARFF file SHA-256 equals the pin below
    - task id and task snapshot SHA-256 equal the pins below
    - resolved target column equals the pin below after quote normalization
    - all columns are numeric and the target is excluded from predictors
    - observed feature shape equals the pin below
    - predictors and targets contain no missing or non-finite values
    - file is read from the explicitly recorded cache snapshot path
  receipt_fields:
    - resolved target column
    - OpenML data id and task id
    - ARFF file SHA-256
    - materialized array SHA-256
    - source manifest SHA-256

