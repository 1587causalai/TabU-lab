schema_version: tabu.transfer-base-real-full-context-frozen-icl-openml-new6.v1
panel_id: tabubase-real-frozen-icl-openml-numeric-nomissing-new6-v1
experiment_id: tabubase-real-full-context-frozen-icl-openml-new6-3x3-v1
status:
  registration: candidate_preregistered
  execution: not_run
  data_materialization: pinned_cache_available_not_evaluated
  empirical_claim: none

purpose: >-
  Evaluate optimizer-free full-context TabUBase ICL with every train-partition
  row visible as labeled context. The historical K<=32 new6 run remains an
  auxiliary low-shot diagnostic and does not answer this estimand.

model:
  contract_id: tabu.cell.base
  contract_version: 0.2.0
  profile_id: supervised.label_broadcast.v1
tokenizer:
  version: cell-tokenizer.v2
  nominal_plan: source_scoped_frozen_codebook.v2
  codebook_size: 100
  codebook_seed: 1729

source_contract:
  provider: OpenML
  api: sklearn.datasets.fetch_openml
  identity_key: data_id
  target_column: default-target
  as_frame: false
  parser: liac-arff
  cache: true
  materialization_checks:
    - returned data_id and version equal the pins below
    - returned upstream md5 and license equal the pins below
    - returned dataset status is active
    - observed feature shape equals the pin below
    - predictors and targets contain no missing or non-finite values
    - classification labels use sorted unique source labels mapped to 0..C-1
  receipt_fields:
    - resolved target column
    - classification label mapping when applicable
    - parser and cache policy
    - materialized array SHA-256
    - source manifest SHA-256

