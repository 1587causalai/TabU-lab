schema_version: tabu.query-row.openml-new6-full-context-panel.v1
panel_id: tabur-query-row-openml-new6-full-context-2026-08-31
status:
  registration: candidate_preregistered
  execution: not_run
  data_materialization: not_run
  empirical_claim: none

purpose: >-
  Main table-foundation-model-style evaluation for the R4 v2 synthetic-pretrained
  TabUR query-row model. Each real dataset has one deterministic train/test split;
  every labeled train row is placed in the frozen evidence context and every
  held-out test row is query-only. This is separate from the low-shot K-grid
  diagnostic and does not inherit Axis-B identity or receipts.

model:
  contract_id: tabu.query.row
  contract_version: '0.1.0'
  model_spec_hash: 24f9ddae70b116b2ac88d2ccc833870ca351de8148774fe8b9fbf72a0c58d1c0
  profile_id: supervised.label_broadcast.v1
  row_token_count: 4
  synthetic_generator_id: tabur.supervised-query-row-diverse-v2

tokenizer:
  version: query-tokenizer.v1
  nominal_plan: episode_random_sphere.v1
  feature_identity: forbidden

source_contract:
  provider: OpenML
  api: sklearn.datasets.fetch_openml
  identity_key: data_id
  target_column: default-target
  as_frame: false
  parser: liac-arff
  cache: true
  materialization_checks:
    - returned data_id, version, md5, license, name, and active status match pins
    - observed predictor and target shapes match pins
    - predictors and targets contain no missing or non-finite values
    - classification labels use deterministic sorted source-label mapping

datasets:
  - {dataset_id: banknote_authentication, openml_name: banknote-authentication, data_id: 1462, version: 1, upstream_md5: baa2dc5b745775a943ebeb9c276401f8, license: Public, task: classification, rows: 1372, predictors: 4, classes: 2}
  - {dataset_id: segment, openml_name: segment, data_id: 36, version: 1, upstream_md5: 037621812203bfd85c8dab1d7f16ebc6, license: Public, task: classification, rows: 2310, predictors: 19, classes: 7}
  - {dataset_id: spambase, openml_name: spambase, data_id: 44, version: 1, upstream_md5: d9ace01aeac3461e326a8e1b2d53fd84, license: Public, task: classification, rows: 4601, predictors: 57, classes: 2}
  - {dataset_id: airfoil_self_noise, openml_name: airfoil_self_noise, data_id: 43919, version: 1, upstream_md5: 79f7daecfdeb6457ba37fd8982966048, license: CC BY 4.0, task: regression, rows: 1503, predictors: 5, classes: null}
  - {dataset_id: concrete_compressive_strength, openml_name: concrete_compressive_strength, data_id: 44959, version: 7, upstream_md5: 1906eae71bd8b8142d079a4b966549ac, license: CC BY 4.0, task: regression, rows: 1030, predictors: 8, classes: null}
  - {dataset_id: qsar_fish_toxicity, openml_name: QSAR_fish_toxicity, data_id: 44970, version: 7, upstream_md5: 4900e250afcfee9d523aba87895260fe, license: CC BY 4.0, task: regression, rows: 908, predictors: 6, classes: null}

evaluation_design:
  checkpoint_seeds: [1729, 2718, 31415]
  split_seeds: [1729, 2718, 31415]
  context_policy: full_train
  split_fraction: 0.7
  query_policy: all_heldout_rows
  query_chunk_rows: 64
  split_before_compile: true
  feature_rule: split first; select at most 63 predictors by train-only variance
  target_truth_visibility: test response absent from model evidence; scorer-only sidecar

baseline_protocol:
  estimators: [ordinary_least_squares, mlp, xgboost]
  fit_scope: all_train_rows_only
  predictor_preprocessing: MLP train-only StandardScaler; linear/XGBoost none
  regression_target_preprocessing: MLP train-only target standardization and inverse transform
  linear: {ridge: 0.0001}
  mlp: {hidden_layer_sizes: [64, 64], activation: relu, solver: adam, alpha: 0.0001, learning_rate_init: 0.001, max_iter: 500, early_stopping: false, shuffle: true, tol: 0.0001}
  xgboost: {n_estimators: 300, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, n_jobs: 8, tree_method: hist}

frozen_protocol:
  arms: [pretrained_frozen, random_init_frozen, pretrained_shuffled]
  requires_grad: false
  eval_mode: true
  inference_mode: true
  optimizer_created: false
  parameter_hash_gate: every checkpoint arm before/after hash must be identical

pass_conditions:
  - all six pinned OpenML datasets materialize with matching source metadata and hashes
  - every checkpoint loads only after matching query identity validation
  - every frozen arm predicts all held-out rows from one full-train evidence episode
  - every metric is finite on identical train/test splits
  - every frozen checkpoint has unchanged parameter hash and no optimizer/update
  - baselines fit all and only the train partition

kill_conditions:
  - any OpenML pin drift, missing value, or materialization mismatch
  - any Axis-B contract identity in the query checkpoint or result
  - any truth leakage into model input or baseline fit
  - any frozen parameter mutation or non-finite metric

claim_boundary: >-
  Candidate preregistration only. This will be a local-unissued descriptive
  full-context OpenML frozen-transfer comparison for R4 v2 TabUR versus
  context-only Linear, MLP, and XGBoost; it is not a formal receipt, benchmark,
  SOTA, causal, or accepted capability claim.
review:
  developer_and_reviewer_must_differ: true
  gong_approval_required_for_release: true
