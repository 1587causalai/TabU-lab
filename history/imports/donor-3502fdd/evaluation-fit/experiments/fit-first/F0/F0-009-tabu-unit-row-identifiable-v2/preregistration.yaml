model_spec:
  schema_version: 1.0.0
  contract_id: tabu.unit_row
  contract_version: 0.1.0
  display_name: TabU (unit-as-row)
  upstream:
    repository: TabU/latex/model-factory
    path: ../latex/model-factory/TabU/unit-as-row.tex
    sha256: 39bb1b521d5bb312ac7bdd1d991633109057e82108b709753f67cf9a86c1f3ba
    readonly: true
    observed_at: '2026-08-28'
    license_boundary: 'Metadata-only reference: upstream TeX remains readonly and is not redistributed by this manifest.'
  carrier:
    input_unit: one carrier row is one Unit by current default
    input_axes:
    - row_unit
    - feature
    - hidden
    shape: N x (M+K) x d
    context_query:
      context: all rows share a cell-completion role
      query: no query rows and no label columns
    tokenization:
      visible_value: type-specific value encoder
      artificial_mask: learned e_mask
      natural_missing: fixed e_null = 0_d
      feature_identity: implicit in address; no Feature-special
    specials:
      unit: K per row
      feature: absent
      corner: absent
    truth_boundary: masked completion truth enters only at Step 5
  dynamics:
    family: row-Unit O-closed Transformer
    entry: no OInject
    operations:
    - slot_from_visible_cells_omab
    - token_from_slot_omab
    - row_axis_omab
    inducing: S transient slots per block; distinct from K Unit-special coordinates
    source_contract: visible cells source; artificial masks are receiver-only
    null_contract: three OMAB operations preserve exact zero
  readout:
    geometry: K Unit-special states multiplied with the evolved target cell token
    support: same-feature other visible cells
    numeric_terminal: default local-linear ridge; NW is nested baseline
    categorical_terminal: NW probability mass on declared domain
    no_support: explicit no-support and terminal exit
  loss:
    truth_entry: Step 5 only
    numeric: MSE on source-normalized masked cell
    categorical: NLL on declared-domain PMF
    target_families:
    - artificial_mask_completion
    weighting: equal across active types by default
  interfaces:
    compile: typed partially observed table where each row is one Unit
    forward: truth-free cell predictions from Unit-special/cell geometry plus trace
    train: supply artificial-mask truth only as a loss sidecar
    infer: artificial-mask completion targets only; natural-missing targets return typed unsupported in frozen v0
  capabilities:
  - unit_as_row
  - artificial_mask_completion
  - mixed_numeric_categorical
  - same_feature_support
  - exact_zero_closure
  maturity:
    source_contract: factory_source
    stage: experimental
    contract: specified
    implementation: experimental
    evidence: specified
    build_state: buildable_contract
  maturity_evidence: null
  mathematics: null
  experimental_defaults:
    unit_mapping: one_row_one_unit
    geometry: unit_special_times_cell
    numeric_terminal: local_linear
    active_type_weights: equal
    reference_backend:
      backend: dense_reference_v0
      provenance: tabu_lab.models.ReferenceConfig; these are implementation experiment defaults, not upstream factory invariants
      d_model: 32
      n_heads: 4
      d_ff: 64
      n_blocks: 2
      inducing_slots: 4
      matched_slots: 4
      max_features: 256
      dropout: 0
      presence_tau: 1.0e-06
      denominator_epsilon: 1e-8
      routing_bandwidth: 1
    inference_targets: artificial_masks_only
  known_open:
  - id: multiple_rows_per_unit
    question: Decide whether multiple rows may represent one semantic Unit.
    blocking_build: false
  - id: natural_missing_inference
    question: 'Future proposal only: define a new contract before natural-missing inference; frozen v0 returns typed unsupported.'
    blocking_build: false
  - id: type_loss_weighting
    question: Freeze non-equal numeric/categorical weights if used.
    blocking_build: false
  - id: slot_matching
    question: Decide whether K coordinates require permutation-invariant matching.
    blocking_build: false
  alternatives:
  - id: numeric_local_linear
    description: Use local-linear ridge with the same routing weights.
    status: first_alternative
  kill:
  - id: truth_leakage
    condition: Changing completion truth changes any Step 1-4 result.
    evidence: truth-substitution invariance test
  - id: feature_special_present
    condition: A Feature-special row or cross-corner is added to the unit-as-row carrier.
    evidence: carrier-role audit
  - id: null_drift
    condition: A natural-missing position leaves exact zero.
    evidence: layerwise exact-zero trace
  exit:
  - id: carrier_shape
    condition: Every layer preserves N x (M+K) x d.
    evidence: shape trace
  - id: unit_cell_geometry
    condition: Every target coordinate is computed from its row Unit-specials and evolved cell state.
    evidence: readout trace
  - id: default_terminal
    condition: Default numeric runs use NW and label LL as the first alternative.
    evidence: run configuration receipt
