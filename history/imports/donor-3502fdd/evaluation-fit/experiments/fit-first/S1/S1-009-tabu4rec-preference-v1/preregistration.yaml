  schedule_id: s1-rec-categorical_preference-schedule-v1
  sampling: deterministic_shuffle
  episode_count: 10
  targets_per_episode: 16
  target_families:
  - completion
  target_origins:
  - artificial_mask
  sampler_seed: 104729
  order_seed: 130363
  recipe_hashes: []
semantic:
  reference:
    backend: dense_reference_v0
    d_model: 32
    n_heads: 4
    d_ff: 64
    n_blocks: 2
    inducing_slots: 4
    matched_slots: 4
    max_features: 256
    dropout: 0.0
    presence_tau: 1.0e-06
    denominator_epsilon: 1.0e-08
    routing_bandwidth: 1.0
    geometry_normalization: none
  numeric_terminal: nadaraya_watson
  categorical_terminal: nadaraya_watson
  augmented_readout_geometry: matched_uf
  label_columns: []
  label_address_plan: null
  target_feature: null
  graph_unit_receiver_plan: null
  response_family: categorical_preference
  recommendation_address_plan: axis_address_bootstrap_v1
  rec_axis_summary_dim: 2
  rec_matched_residual_scale: 0.1
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  max_updates: 3000
  max_epochs: null
  wall_clock_budget_minutes: 15
  episode_batch_size: 1
  scheduler: none
  exact_resume: true
  warm_start: false
  pretraining: false
execution:
  device: cuda
  device_index: 0
  dtype: float32
  deterministic_algorithms: true
  evidence_mode: gate
  compile_on_cpu: true
  backend: dense_reference_v0
seeds:
  model_seeds:
  - 1729
  - 2718
  - 31415
