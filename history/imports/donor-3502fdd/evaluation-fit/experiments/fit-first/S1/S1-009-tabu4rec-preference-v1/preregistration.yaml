  max_updates: null
- baseline_id: frozen-initialization
  role: diagnostic
  max_updates: null
pass_gate:
  stage: S1
  required_coverage: 1.0
  max_loss_ratio: 0.1
  max_trivial_baseline_ratio: 0.5
  max_numeric_mse: null
  max_numeric_nrmse: 0.05
  min_categorical_accuracy: 0.98
  max_categorical_nll: 0.1
  require_all_seeds: true
kill_conditions:
