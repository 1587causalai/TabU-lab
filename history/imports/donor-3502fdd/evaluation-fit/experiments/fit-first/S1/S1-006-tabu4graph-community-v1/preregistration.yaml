model_spec:
  schema_version: 1.0.0
  contract_id: tabu4graph
  contract_version: 0.1.0
  display_name: TabU4Graph
  upstream:
    repository: TabU/latex/model-factory
    path: ../latex/model-factory/TabU4Graph/main.tex
    sha256: 76db675d065592b8dbf374dd12a2a9bfcfa2f4adbcebbb978bf287ad76d3cb62
    readonly: true
    observed_at: '2026-08-27'
    license_boundary: 'Metadata-only reference: upstream TeX remains readonly and is not redistributed by this manifest.'
  carrier:
    input_unit: graph-linked row address; node-to-Unit mapping is task-declared
    input_axes:
    - unit
    - feature
    - hidden
    shape: (N+K) x (M+K) x d
    context_query:
      context: visible cells plus declared graph topology are input evidence
      query: no query rows; masked cells are receivers
    tokenization:
      visible_value: type-specific value encoder
      artificial_mask: learned e_mask
      natural_missing: fixed e_null = 0_d
      target_feature: one declared feature tau
    specials:
      unit: K per row
      feature: K per column; currently global prototype
      corner: K x K fixed zero
    truth_boundary: masked completion truth enters only at Step 5
  dynamics:
    family: graph-constrained O-closed augmented-table Transformer
    entry: zero-preserving gated broadcast-add from visible target feature tau
    operations:
    - graph_local_slot_from_neighborhood
    - ordinary_token_from_graph_slots
    - unit_special_from_closed_neighborhood
    - within_row_feature_axis
    documented_count: source prose also calls this three OMAB; operation accounting is unresolved
    inducing: neighborhood-conditioned transient slots S_(r,a), distinct from K
    source_contract: cross-Unit sources are restricted to the declared closed neighborhood; row axis remains within Unit
    null_contract: broadcast-add and OMAB paths claim exact-zero preservation
  readout:
    geometry: matched Unit-special/Feature-special diagonal inner products in R^K
    support: same-column visible cells, inherited from TabUF and not graph-local
    numeric_terminal: LL/NW wording drifts from TabUF's frozen NW default; not frozen here
    categorical_terminal: NW probability mass on declared domain
    no_support: explicit no-support and terminal exit
  loss:
    truth_entry: Step 5 only
    numeric: MSE on source-normalized masked cell
    categorical: NLL on declared-domain PMF
    target_families:
    - artificial_mask_completion
    weighting: equal across active types by default
  interfaces:
    compile: typed Unit-Feature table, declared graph/node mapping, target feature tau, visibility, and masks
    forward: truth-free cell predictions with graph-source and readout-support traces
    train: supply masked cell truth only as a loss sidecar
    infer: declare targets, graph direction semantics, and target feature without broadcasting hidden truth
  capabilities:
  - graph_conditioned_completion
  - target_feature_broadcast
  - mixed_numeric_categorical
  - same_column_readout
  - exact_zero_closure_claim
  maturity:
    source_contract: factory_source
    stage: experimental
    contract: specified
    implementation: experimental
    evidence: specified
    build_state: buildable_contract
  maturity_evidence: null
  mathematics: null
  experimental_defaults:
    neighborhood: symmetrized_closed_with_self
    target_feature_count: 1
    feature_special_scope: global_column
    numeric_terminal: null
    broadcast_gate: fixed_rho_ba
    reference_backend:
      backend: dense_reference_v0
      provenance: tabu_lab.models.ReferenceConfig; these are implementation experiment defaults, not upstream factory invariants
      d_model: 32
      n_heads: 4
      d_ff: 64
      n_blocks: 2
      inducing_slots: 4
      matched_slots: 4
      max_features: 256
      dropout: 0
      presence_tau: 1.0e-06
      denominator_epsilon: 1e-8
      routing_bandwidth: 1
    target_feature_index: 0
  known_open:
  - id: omab_count_conflict
    question: Resolve the prose claim of three OMAB against four separately specified operations.
    blocking_build: false
  - id: empty_neighborhood_zero_conflict
    question: Resolve exact-zero behavior when learned nonzero inducing seeds meet an empty eligible neighborhood.
    blocking_build: false
  - id: numeric_default_drift
    question: Freeze whether TabUF's NW default carries over or LL/NW is a run choice.
    blocking_build: false
  - id: directed_edge_semantics
    question: Choose incoming, outgoing, or symmetrized sources for directed graphs.
    blocking_build: false
  - id: global_feature_special_locality
    question: Decide whether global Feature-special prototypes violate the intended graph locality.
    blocking_build: false
  - id: broadcast_gate_semantics
    question: Freeze the differentiable zero-preserving gate versus a true ungated add.
    blocking_build: false
  - id: multiple_target_features
    question: Specify selection and semantics before supporting more than one target feature.
    blocking_build: false
  alternatives:
  - id: graph_local_feature_prototype
    description: Replace global Feature-special prototypes with neighborhood-local prototypes.
    status: deferred
  - id: directed_neighborhood
    description: Use declared incoming or outgoing edge semantics.
    status: deferred
  kill:
  - id: truth_leakage
    condition: Changing completion truth changes any Step 1-4 result.
    evidence: truth-substitution invariance test
  - id: edge_escape
    condition: A cross-Unit source outside the declared neighborhood changes a receiver.
    evidence: edge-deletion and Jacobian test
  - id: masked_tau_broadcast
    condition: Masked or natural-missing target-feature truth is broadcast.
    evidence: entry source-mask trace
  exit:
  - id: topology_sensitivity
    condition: Changing an allowed graph edge can change relevant states while deleting all incident evidence removes that
      path.
    evidence: paired graph perturbation trace
  - id: operation_accounting
    condition: Runtime traces name and count every graph-local and row-axis operation without collapsing distinct source masks.
    evidence: operation trace
  - id: locality_boundary
    condition: Reports separately identify graph-local dynamics and the potentially global same-column readout.
    evidence: forward trace plus readout support ledger
